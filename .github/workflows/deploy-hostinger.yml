name: Déployer sur maths.datagrade.fr

# Compile l'application MathALÉA complète (mathalea/) puis la dépose par FTP (lftp)
# dans alea/ du site Hostinger maths.datagrade.fr (la racine du compte FTP est
# déjà public_html), avec une redirection de la racine du site vers /alea/.
#
# Secrets du dépôt attendus (Settings → Secrets and variables → Actions) :
#   FTP_HOST      hôte FTP affiché par Hostinger (sans ftp://)
#   FTP_USER      nom d'utilisateur FTP complet (u….maths.datagrade.fr)
#   FTP_PASSWORD  mot de passe du compte FTP
# Aucune de ces valeurs n'apparaît dans le dépôt ni dans les journaux.

on:
  workflow_dispatch:
    inputs:
      annales:
        description: "Renvoyer aussi les annales (dossier static/, 1,5 Go)"
        type: boolean
        default: false
  push:
    branches:
      - integration/mathalea-complet
      - main
    paths:
      - 'mathalea/**'
      - 'hostinger/**'
      - '.github/workflows/deploy-hostinger.yml'

permissions:
  contents: read

# Un seul déploiement à la fois : deux envois FTP simultanés se marcheraient dessus.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Compiler et déposer par FTP
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HUSKY: '0'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Vérifier la présence des secrets FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          manquants=""
          [ -n "$FTP_HOST" ] || manquants="$manquants FTP_HOST"
          [ -n "$FTP_USER" ] || manquants="$manquants FTP_USER"
          [ -n "$FTP_PASSWORD" ] || manquants="$manquants FTP_PASSWORD"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets absents :$manquants. Les créer dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$FTP_HOST" in
            *://*) echo "::error::FTP_HOST doit être un nom d'hôte ou une IP, sans ftp://"; exit 1 ;;
          esac

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Les annales (mathalea/public/static/, 1,5 Go et les deux tiers des fichiers)
      # ne changent presque jamais : on ne parcourt leur dossier sur le serveur que
      # si ce push les a modifiées, si on le demande à la main, ou si elles manquent
      # en ligne (vérifié juste avant l'envoi). Un déploiement courant ne relit donc
      # que l'application.
      - name: Les annales ont-elles changé ?
        id: annales
        env:
          EVENEMENT: ${{ github.event_name }}
          FORCER: ${{ inputs.annales }}
          AVANT: ${{ github.event.before }}
        run: |
          set -u
          annales=0
          if [ "$EVENEMENT" = "workflow_dispatch" ]; then
            [ "$FORCER" = "true" ] && annales=1
          elif [ -z "$AVANT" ] || [ "$AVANT" = "0000000000000000000000000000000000000000" ]; then
            annales=1
          elif ! git fetch --quiet --depth=1 origin "$AVANT"; then
            echo "Commit précédent introuvable : par prudence, les annales sont revérifiées."
            annales=1
          elif ! git diff --quiet "$AVANT" HEAD -- mathalea/public/static; then
            annales=1
          fi
          echo "valeur=$annales" >> "$GITHUB_OUTPUT"
          if [ "$annales" = "1" ]; then echo "Annales à synchroniser."; else echo "Annales inchangées : dossier static/ ignoré."; fi

      - name: Vérifier que mathalea/ est bien la copie amont
        run: node scripts/verify-upstream.mjs

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: mathalea/pnpm-lock.yaml

      - name: Installer les dépendances verrouillées
        working-directory: mathalea
        run: pnpm install --frozen-lockfile

      - name: Compiler l'application (base /alea/)
        working-directory: mathalea
        run: pnpm build

      - name: Préparer le dossier à publier
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
          AXIO_GATE_SECRET: ${{ secrets.AXIO_GATE_SECRET }}
          AXIO_PORTIER: ${{ vars.AXIO_PORTIER }}
        run: |
          set -euo pipefail
          test -f mathalea/dist/index.html
          cp hostinger/alea.htaccess mathalea/dist/.htaccess
          # Portier : index.php sert index.html aux visiteurs venus de DataGrade
          # (jeton signé ou cookie). Il vérifie les jetons avec la clé publique de
          # DataGrade, qu'il lit lui-même : aucun secret n'est nécessaire. Le secret
          # AXIO_GATE_SECRET (ancienne clé partagée) reste accepté s'il existe, et la
          # variable de dépôt AXIO_PORTIER=ouvert rouvre le site à tous.
          cp hostinger/acces.php mathalea/dist/index.php
          php -l mathalea/dist/index.php
          umask 077
          php -r 'echo "<?php\nreturn " . var_export(["secret" => (string) getenv("AXIO_GATE_SECRET"), "ouvert" => getenv("AXIO_PORTIER") === "ouvert"], true) . ";\n";' > mathalea/dist/acces-config.php
          php -l mathalea/dist/acces-config.php
          if [ "${AXIO_PORTIER:-}" = "ouvert" ]; then echo "::warning::AXIO_PORTIER=ouvert : le site est ouvert à tous."; else echo "Portier actif : accès réservé aux visiteurs venus de DataGrade."; fi
          # Fiche de version lisible en ligne (https://maths.datagrade.fr/alea/deploiement.json)
          # et accès aux sources de la version déployée, comme le demande la licence AGPL.
          cat > mathalea/dist/deploiement.json <<JSON
          {
            "application": "MathALÉA pour DataGrade",
            "commit": "$SHA",
            "branche": "$REF",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sources": "$REPO/tree/$SHA/mathalea",
            "origine": "https://forge.apps.education.fr/coopmaths/mathalea",
            "licence": "AGPL-3.0"
          }
          JSON
          echo "Fichiers à publier : $(find mathalea/dist -type f | wc -l), taille : $(du -sh mathalea/dist | cut -f1)"

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Déposer par FTP dans alea/ (racine FTP = public_html)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ANNALES: ${{ steps.annales.outputs.valeur }}
        run: |
          set -euo pipefail
          # Annales : synchronisées si elles ont changé, ou si une annale témoin
          # ne répond pas en ligne (premier déploiement, dossier effacé…).
          temoin="$(cd mathalea/dist/static && find . -type f -name '*.png' -print -quit | sed 's|^\./||')"
          if [ "$ANNALES" != "1" ] && [ -n "$temoin" ] && ! curl --fail --silent --head --max-time 30 "https://maths.datagrade.fr/alea/static/$temoin" >/dev/null; then
            echo "Annale témoin absente en ligne ($temoin) : les annales sont synchronisées."
            ANNALES=1
          fi
          if [ "$ANNALES" = "1" ]; then
            MIROIR_ANNALES="mirror -R --ignore-time --delete --no-perms --verbose=1 mathalea/dist/static/ alea/static/"
          else
            MIROIR_ANNALES="# annales inchangees : dossier alea/static/ non parcouru"
          fi
          # Hostinger coupe le canal de données en FTPS (ECONNRESET dès le premier
          # dossier, cf. exécution 42604671545). La connexion de contrôle, qui porte
          # les identifiants, reste chiffrée (AUTH TLS obligatoire) ; les données,
          # publiques de toute façon, passent en clair, comme le fait FileZilla.
          # L'hôte est une IP : son certificat ne porte pas ce nom, d'où l'absence
          # de vérification (même réglage que « security: loose » auparavant).
          #
          # Reprise, en trois temps pour que le site reste utilisable pendant l'envoi :
          #   1. ajout des fichiers absents ou de taille différente, sans rien
          #      supprimer (--ignore-time : la date du checkout change à chaque
          #      exécution) et sans toucher aux pages : l'ancienne page d'accueil
          #      garde ses anciens scripts jusqu'au basculement ;
          #   2. renvoi d'office des fichiers non hachés qui changent à chaque
          #      version (index.html, index.php, version.txt, deploiement.json,
          #      .htaccess) : la nouvelle page trouve tous ses fichiers déjà en place ;
          #   3. suppression des fichiers disparus du build (anciens scripts hachés).
          # Le dossier static/ (annales) est exclu de ces trois temps et traité à
          # part, seulement quand c'est nécessaire. Cinq transferts en parallèle.
          lftp <<LFTP
          set net:timeout 40
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data false
          set ssl:verify-certificate false
          set mirror:parallel-transfer-count 5
          open "ftp://$FTP_HOST"
          user "$FTP_USER" "$FTP_PASSWORD"
          # La racine du compte FTP est déjà public_html : la cible est donc alea/.
          # Le premier envoi (avant cette correction) avait créé public_html/alea/
          # un cran trop bas : on le renomme en place si c'est encore le cas, sans
          # rien renvoyer. Ces deux commandes peuvent échouer sans conséquence.
          mv public_html/alea alea
          rmdir public_html
          set cmd:fail-exit true
          mirror -R --ignore-time --no-perms --verbose=1 \
            --exclude '^index\.html$' --exclude '^index\.php$' --exclude '^acces-config\.php$' \
            --exclude '^version\.txt$' --exclude '^deploiement\.json$' --exclude '^\.htaccess$' \
            --exclude '^static/' \
            mathalea/dist/ alea/
          $MIROIR_ANNALES
          put -O alea/ mathalea/dist/index.html mathalea/dist/index.php mathalea/dist/acces-config.php mathalea/dist/version.txt mathalea/dist/deploiement.json mathalea/dist/.htaccess
          put -O . hostinger/root.htaccess -o .htaccess
          mirror -R --ignore-time --delete --no-perms --verbose=0 \
            --exclude '^static/' --exclude '^acces-local\.php$' --exclude '^acces-cle\.json$' \
            mathalea/dist/ alea/
          bye
          LFTP
          echo "Envoi terminé."

      - name: Vérifier la version en ligne
        env:
          SHA: ${{ github.sha }}
        run: |
          set -u
          url=https://maths.datagrade.fr/alea/deploiement.json
          for essai in 1 2 3; do
            if corps="$(curl --fail --silent --show-error --max-time 30 "$url")" && printf '%s' "$corps" | grep -q "$SHA"; then
              echo "::notice::En ligne : $url sert bien le commit $SHA."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url ne sert pas le commit $SHA (réponse : ${corps:-aucune}). Les fichiers ont été déposés mais le site ne les sert pas : vérifier le dossier cible et le SSL."
          exit 1
