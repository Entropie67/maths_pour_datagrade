  <body class="flex-col min-h-full w-full font-sans touch-manipulation">
    <div id="appMathalea">
      <div id="loading" class="hidden">
        <!-- AxioMaths (DataGrade) : triangle de Penrose animé pendant le chargement,
             à la place du dé MathALÉA. Visible tant que la feuille de style de
             l'application n'est pas chargée (la classe Tailwind « hidden » prend
             alors le relais). -->
        <svg class="axio-penrose" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Chargement d'AxioMaths">
          <polygon class="axio-bar axio-bar-1" points="113.9,44.0 176.2,152.0 148.5,152.0 134.6,128.0 100.0,68.0" />
          <polygon class="axio-bar axio-bar-2" points="148.5,152.0 23.8,152.0 37.6,128.0 65.4,128.0 134.6,128.0" />
          <polygon class="axio-bar axio-bar-3" points="37.6,128.0 100.0,20.0 113.9,44.0 100.0,68.0 65.4,128.0" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/bootstrap"></script>
  </body>

  <style>
    #loading {
      left: 50% !important;
      margin-left: -100px;
      position: fixed !important;
      top: 50% !important;
      margin-top: -100px;
      width: 200px;
      z-index: 9000 !important;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    /* Triangle de Penrose (AxioMaths) : rotation lente, les trois barres
       s'éclairent tour à tour. Immobile si l'utilisateur limite les animations. */
    .axio-penrose {
      display: block;
      width: 200px;
      height: 200px;
      transform-origin: 100px 108px;
      animation: axio-tourne 9s linear infinite;
      filter: drop-shadow(0 8px 18px rgba(76, 29, 149, 0.25));
    }

    .axio-bar {
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linejoin: round;
      animation: axio-pulse 2.4s ease-in-out infinite;
    }

    .axio-bar-1 { fill: #4c1d95; animation-delay: 0s; }
    .axio-bar-2 { fill: #7c3aed; animation-delay: 0.8s; }
    .axio-bar-3 { fill: #c4b5fd; animation-delay: 1.6s; }

    @keyframes axio-tourne {
      to { transform: rotate(360deg); }
    }

    @keyframes axio-pulse {
      0%, 100% { opacity: 0.55; }
      33% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .axio-penrose, .axio-bar { animation: none; }
    }
  </style>
