        CHANGED_FILES=$(git diff-tree -r --cc --name-only --no-commit-id HEAD | while read -r f; do [ -f "$f" ] && echo "$f"; done)
      elif git rev-parse --verify "$DIFF_BASE" >/dev/null 2>&1; then
