      FAIL=0
      echo "🧪 test:e2e:interactivity"
      if pnpm test:e2e:interactivity; then
      STATUS_INTERACTIVITY=ok
      else
      STATUS_INTERACTIVITY=ko
      FAIL=1
      fi

      echo ""
      echo "═══════════════════════════════════════════"
      [ "$STATUS_INTERACTIVITY" = "ok" ] && echo "✅ test:e2e:interactivity" || echo "❌ test:e2e:interactivity"
      echo "═══════════════════════════════════════════"

      exit "$FAIL"
  artifacts:
    when: on_failure
    expire_in: 2 days
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - unknown_failure
      - script_failure
  rules:
    - !reference [.hors_deploiement, rules]
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == "pipeline"
      when: manual
    - when: never

# Rapport d'accessibilité : informatif, il ne doit jamais faire échouer un pipeline.
# Il a son propre pipeline planifié (variable A11Y_REPORT=true), car les planifications
# existantes tournent plusieurs fois par jour.
# Cf documentation/tests/rapport-accessibilite.md
a11y-report:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  stage: playwright
  needs: []
  # Un push sur main ne doit pas faire perdre le passage de la semaine
  interruptible: false
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - node_modules
    paths:
      - .pnpm-store/
    policy: pull
  allow_failure: true
  timeout: 1h
  script:
    - npm install -g pnpm@12.6.0
    - pnpm install --frozen-lockfile --prefer-offline --silent
    # Comparer au dernier passage du job, sinon au fichier versionné dans reports/
    - |
      if curl --silent --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --output a11y-precedent.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/raw/reports/a11y-status.json?job=a11y-report"; then
        export A11Y_PREVIOUS=a11y-precedent.json
      else
        echo "Pas de passage précédent en CI : comparaison à reports/a11y-status.json"
      fi
    - bash tasks/ci-with-dev-server.sh pnpm a11y:report || echo "⚠️ Rapport d'accessibilité non produit, voir artifacts/ci-vite.log"
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - reports/a11y-report.md
      - reports/a11y-status.json
      - artifacts/ci-vite.log
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - unknown_failure
  rules:
    - if: $A11Y_REPORT == "true"
      when: always
    - if: $CI_COMMIT_BRANCH == "pipeline"
      when: manual
    - when: never

