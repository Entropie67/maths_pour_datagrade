# ======================================================================================= #
# Tests effectués à chaque demande de fusion avec les exercices modifiés sur 5 commmits.  #
# ======================================================================================= #

# Job consolidé : exécute les tests des exercices modifiés en séquence
# Cela remplace 4 jobs précédents :
# - testExosModifiedWithoutPlayWright
# - testExosModified
# - testExosModifiedInteractif
# - testExosModifiedAmcnum
# Économies : 1 seul runner, 1 seule installation de dépendances, 1 seul démarrage du serveur

testExosModifiedConsolidated:
  extends: .testExosModifiedConsolidated
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - node_modules
    paths:
      - .pnpm-store/
    policy: pull
  script:
    - npm install -g pnpm@12.6.0
    - NODE_OPTIONS=--max-old-space-size=4096
    # Récupérer les fichiers modifiés par le dernier commit
    # (le commit du pipeline, pas la pointe actuelle de la branche)
    - git fetch origin "$CI_COMMIT_SHA" --depth=10
    - git checkout FETCH_HEAD
    - |
      # ============================================================
      # PHASE 1: Récupérer les fichiers modifiés
      # ============================================================
      COMMIT_COUNT=$(git rev-list --count HEAD)
      MAX_COMMITS=1

      if [ "$COMMIT_COUNT" -lt "$MAX_COMMITS" ]; then
        DIFF_BASE="HEAD~$((COMMIT_COUNT - 1))"
      else
        DIFF_BASE="HEAD~$MAX_COMMITS"
      fi
      echo "Comparing from $DIFF_BASE to HEAD"

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ] && git rev-parse --verify --quiet HEAD^2 >/dev/null; then
        # Fusion de main dans la branche (git pull) : HEAD~1..HEAD contiendrait tout
        # ce que main apporte. Seuls les fichiers qui diffèrent de chaque parent sont testés.
        echo "Commit de fusion : fichiers modifiés par rapport à chacun des parents"
        # git met entre guillemets les chemins non ASCII (modèlesExos) : `-f` ne les trouve
        # pas. Ils restent dans la liste, comme sans fusion ; seul le contrôle d'accessibilité les lit.
        CHANGED_FILES=$(git diff-tree -r --cc --name-only --no-commit-id HEAD | while read -r f; do { [ -f "$f" ] || [ "${f#\"}" != "$f" ]; } && echo "$f"; done)
      elif git rev-parse --verify "$DIFF_BASE" >/dev/null 2>&1; then
        echo "Comparing from $DIFF_BASE to HEAD"
        CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$DIFF_BASE"..HEAD)
      else
        echo "⚠️ Le commit $DIFF_BASE n'est pas disponible (clone trop peu profond ?)"
        CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
      fi

      echo ""
      echo "📋 Fichiers modifiés:"
      echo "$CHANGED_FILES"
      echo ""

      # ============================================================
      # PHASE 2: Tests unitaires et e2e
      # ============================================================

      # Test 1/7 : Console errors (Playwright)
      echo "🧪 Test 1/7: Console errors..."
      if CHANGED_FILES="$CHANGED_FILES" bash tasks/ci-with-dev-server.sh pnpm test:e2e:console_errors; then
        STATUS_CONSOLE=ok
      else
        STATUS_CONSOLE=ko
      fi

      # Test 2/7 : All exercises vitest (sans Playwright)
      echo "🧪 Test 2/7: All exercises vitest..."
      if CHANGED_FILES="$CHANGED_FILES" pnpm vitest --config tests/e2e/vitest.config.all_exercises.js --run; then
        STATUS_VITEST=ok
      else
        STATUS_VITEST=ko
      fi

      # Test 3/7 : Integration interactivity
      echo "🧪 Test 3/7: Integration interactivity..."
      if INTERACTIF_REPORT=1 CHANGED_FILES="$CHANGED_FILES" pnpm vitest tests/integration/interactivity_all.test.ts --run; then
        STATUS_INTERACTIF=ok
      else
        STATUS_INTERACTIF=ko
      fi

      # Test 4/7 : AMCnum report
      echo "🧪 Test 4/7: AMCnum report..."
      if AMCNUM_REPORT=1 CHANGED_FILES="$CHANGED_FILES" pnpm vitest src/lib/amc/report-amcnum.test.ts --run; then
        STATUS_AMCNUM=ok
      else
        STATUS_AMCNUM=ko
      fi

      # Test 5/7 : Stabilité des tirages
      # cf documentation/tests/stabilite-exercices.md
      echo "🧪 Test 5/7: Stabilité des tirages..."
      # Uuids disparus : comparer au départ de la branche, pas à la pointe de main (#9937)
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        export BASE_REF="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        git fetch origin "$BASE_REF" --depth=1 || echo "⚠️ Départ de la branche $BASE_REF introuvable"
      fi
      if CHANGED_FILES="$CHANGED_FILES" pnpm stability:check; then
        STATUS_STABILITE=ok
      else
        STATUS_STABILITE=ko
      fi





      # Réponses courtes : corpus #9651 et exercices modifiés.
      echo "🧪 Test 6/7: Corrections minimales..."
      if CHANGED_FILES="$CHANGED_FILES" pnpm corrections:check; then
        STATUS_CORRECTIONS=ok
      else
        STATUS_CORRECTIONS=ko
      fi

      # Informatif : hors du décompte, ne fait jamais échouer le job.
      # cf documentation/tests/controle-accessibilite.md
      echo "🧪 Test 7/7: Accessibilité (informatif)..."
      if CHANGED_FILES="$CHANGED_FILES" pnpm a11y:check; then
        STATUS_A11Y=ok
      else
        STATUS_A11Y=ko
      fi

      # ============================================================
      # PHASE 3: Résumé final
      # ============================================================
      echo ""
      echo "═══════════════════════════════════════════"
      echo "📊 Résumé des tests consolidés"
      echo "═══════════════════════════════════════════"
      [ "$STATUS_CONSOLE" = "ok" ] && echo "✅ Console errors" || echo "❌ Console errors"
      [ "$STATUS_VITEST" = "ok" ] && echo "✅ All exercises vitest" || echo "❌ All exercises vitest"
      [ "$STATUS_INTERACTIF" = "ok" ] && echo "✅ Interactivity report" || echo "❌ Interactivity report"
      [ "$STATUS_AMCNUM" = "ok" ] && echo "✅ AMCnum report" || echo "❌ AMCnum report"
      [ "$STATUS_STABILITE" = "ok" ] && echo "✅ Stabilité des tirages" || echo "❌ Stabilité des tirages"
      [ "$STATUS_CORRECTIONS" = "ok" ] && echo "✅ Corrections minimales" || echo "❌ Corrections minimales"
      [ "$STATUS_A11Y" = "ok" ] && echo "ℹ️  Accessibilité : informatif, voir le rapport ci-dessus" || echo "⚠️  Accessibilité : rapport non produit (informatif, sans effet sur le résultat)"

      OK_COUNT=0
      [ "$STATUS_CONSOLE" = "ok" ] && OK_COUNT=$((OK_COUNT + 1))
      [ "$STATUS_VITEST" = "ok" ] && OK_COUNT=$((OK_COUNT + 1))
      [ "$STATUS_INTERACTIF" = "ok" ] && OK_COUNT=$((OK_COUNT + 1))
      [ "$STATUS_AMCNUM" = "ok" ] && OK_COUNT=$((OK_COUNT + 1))
      [ "$STATUS_STABILITE" = "ok" ] && OK_COUNT=$((OK_COUNT + 1))
      [ "$STATUS_CORRECTIONS" = "ok" ] && OK_COUNT=$((OK_COUNT + 1))
      echo ""
      echo "Résultat global: $OK_COUNT/6 sous-tests bloquants OK"
      echo "═══════════════════════════════════════════"

      # Fail si au moins un test a échoué
      if [ "$OK_COUNT" -lt 6 ]; then
        exit 1
      fi
  rules:
    - !reference [.hors_deploiement, rules]
    # Se lance uniquement si le pipeline est déclenché par une Merge Request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "guironne-jobs"
      when: manual
    - when: never
  artifacts:
    when: on_failure
    expire_in: 2 day
    paths:
      - artifacts/ci-vite.log

