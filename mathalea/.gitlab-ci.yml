# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

stages:
  - setup
  - planified
  - test
  - playwright-test
  - build-projet
  - compile-pdf
  - playwright
  - playwright-pdfDNB
  - playwright-pdfBAC
  - build_ci_pdf
  - build
  - release
  - deploy
  - monitor

variables:
  SAST_EXCLUDED_PATHS: 'node_modules,.pnpm-store,dist,build,coverage,logs,.cache,.git,tests/e2e,playwright-report'
  SAST_EXCLUDED_ANALYZERS: 'bandit,gosec,flawfinder,brakeman'
  FF_USE_POD_ACTIVE_DEADLINE_SECONDS: 'false'
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ''
  DOCKER_IMAGE: '$CI_REGISTRY_IMAGE/ci/tex-node:node22-texlive-2026-06'
  DOCKERFILE: docker/ci-pdf/Dockerfile
  PNPM_STORE_DIR: .pnpm-store
  PNPM_CONFIG_CACHE_DIR: .pnpm-store
  KUBERNETES_MEMORY_REQUEST: '6Gi'
  KUBERNETES_MEMORY_LIMIT: '10Gi'

cache:
  key:
    files:
      - pnpm-lock.yaml
      - node_modules
  paths:
    - .pnpm-store/

semgrep-sast:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: never

sast:
  rules:
    - when: never

include:
  - template: Security/SAST.gitlab-ci.yml
  # Hébergement Scaleway (image du site, staging, production) : deploy/README.md
  - local: deploy/gitlab-ci.yml

# Un pipeline lancé avec DEPLOY_STAGING=true (le scheduled pipeline de
# déploiement du staging, ou "Run pipeline" à la main) ne fait que déployer :
# les jobs de test et de construction du dépôt s'effacent, seuls ceux de
# deploy/gitlab-ci.yml tournent.
# De même, A11Y_REPORT=true ne lance que le job a11y-report.
.hors_deploiement:
  rules:
    - if: $DEPLOY_STAGING == "true"
      when: never
    - if: $A11Y_REPORT == "true"
      when: never

default:
  interruptible: true # Annule le job si un nouveau pipeline démarre
  image: node:23.9.0

.pnpm_setup:
  before_script:
    - npm install -g pnpm@12.6.0

setup:
  stage: setup
  image: node:23.9.0
  extends: .pnpm_setup
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - node_modules
    paths:
      - .pnpm-store/
    policy: pull-push
  script:
    - pnpm install --frozen-lockfile --prefer-offline --silent
  rules:
    - !reference [.hors_deploiement, rules]
    # Se lance uniquement si le pipeline est déclenché par une Merge Request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "guironne-jobs"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == "pipeline"
      when: always
    - when: never
  artifacts:
    untracked: false
    when: on_success
    expire_in: 1 day

build_ci_pdf:
  stage: build-projet
  image: gcr.io/kaniko-project/executor:v1.23.2-debug
  variables:
    DEST_IMAGE: '$CI_REGISTRY_IMAGE/ci/tex-node:node22-texlive-2026-06'
    CACHE_REPO: '$CI_REGISTRY_IMAGE/cache/kaniko'
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"gitlab-ci-token\",\"password\":\"$CI_JOB_TOKEN\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --destination="$DEST_IMAGE" --cache=true --cache-repo="$CACHE_REPO" --dockerfile="$DOCKERFILE"
  rules:
    - !reference [.hors_deploiement, rules]
    - if: $CI_COMMIT_BRANCH == "pipeline"
      when: manual
    - if: $CI_COMMIT_BRANCH == "guironne-jobs"
      when: manual
    - when: never
# ================================================ #
#             Templates
# ================================================ #
.testCIPDF:
  image: $DOCKER_IMAGE
  stage: compile-pdf
  allow_failure: false
  timeout: 5h
  script:
    - npm install -g pnpm@12.6.0
  rules:
    - !reference [.hors_deploiement, rules]
    - if: $CI_COMMIT_BRANCH == "guironne-jobs"
      when: always
    - if: $CI_COMMIT_BRANCH == "mathalea-jobs"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_TEST_MA == "PDF"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == "pipeline"
      when: manual
    - when: never
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - unknown_failure
  artifacts:
    when: always
    expire_in: 2 day
    # exclude:
    #  - updatefile/output/*.*
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - node_modules
    paths:
      - .pnpm-store/
    policy: pull

.testCI:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  stage: playwright-test
  allow_failure: true
  timeout: 5h
  rules:
    - !reference [.hors_deploiement, rules]
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH == "guironne-jobs"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - if: $CI_COMMIT_BRANCH == "pipeline"
      when: manual
    - when: never
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - unknown_failure
  artifacts:
    when: on_failure
    expire_in: 2 day
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - node_modules
    paths:
      - .pnpm-store/
    policy: pull

.install_dependenciesPDFDNB:
  extends: .testCIPDF
  before_script:
    - git clone https://forge.apps.education.fr/coopmaths/dnb.git ./public/static/dnb
    - mv ./public/static/dnb/sujets_decoupes/* ./public/static/dnb/
  script:
    - pnpm run makeJson

.install_dependenciesPDFBAC:
  extends: .testCIPDF
  before_script:
    - git clone https://forge.apps.education.fr/coopmaths/bac.git ./public/static/bac
  script:
    - pnpm run makeJson

.testExosModifiedConsolidated:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  stage: build-projet
  allow_failure: false
  timeout: 5h
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - unknown_failure
      - script_failure
  artifacts:
    when: on_failure
    expire_in: 2 day
  cache:
    key:
      files:
        - pnpm-lock.yaml
        - node_modules
    paths:
      - .pnpm-store/
    policy: pull

# ======================================= #
# Tests effectués la nuit sur branche Guironne-Jobs #
# ========================================#
playwright-console-consolidated:
  extends: .testCI
  stage: playwright-test
  timeout: 5h
  allow_failure: true
  # Un job par niveau : chaque niveau prend 25 à 35 min et les runners de la
  # Forge coupent tout job au bout de 2 h, quel que soit `timeout`.
  parallel:
    matrix:
      - NIV:
          - '6e/6'
          - '5e/5'
          - '4e/4'
          - '3e/3'
          - '2e/2'
          - '1e/1'
          - 'TEx^TSpe^techno'
          - 'QCM'
          - 'can/6e^can/5e'
          - 'can/4e^can/3e'
          - 'can/2e^can/1e'
          - 'can/Ex^can/TSpe'
  script:
    - npm install -g pnpm@12.6.0
    - nohup pnpm start 2>&1 >/dev/null &
    - sleep 50
    - until $(curl --output /dev/null --head --fail http://localhost:80/alea/); do printf '.'; sleep 20; done
    - echo "🧪 console_errors NIV=$NIV"
    - pnpm test:e2e:console_errors
  artifacts:
    when: on_failure
    paths:
      - updatefile/output/can*
      - updatefile/output/6e*
      - updatefile/output/5e*
      - updatefile/output/4e*
      - updatefile/output/3e*

playwright-pdf-consolidated:
  extends: .testCIPDF
  stage: compile-pdf
  timeout: 5h
  allow_failure: false
  script:
    - npm install -g pnpm@12.6.0
    - nohup pnpm start 2>&1 >/dev/null &
    - sleep 30
    - until $(curl --output /dev/null --head --fail http://localhost:80/alea/); do printf '.'; sleep 20; done
    - |
      FAIL=0

      run_pdf () {
        NIV_LABEL="$1"
        STATUS_VAR="$2"
        echo "🧪 pdfexports NIV=$NIV_LABEL"
        if NIV="$NIV_LABEL" STYLES="Coopmaths" pnpm test:e2e:pdfexports; then
          eval "$STATUS_VAR=ok"
        else
          eval "$STATUS_VAR=ko"
          FAIL=1
        fi
      }

      run_pdf "can/2e" STATUS_CAN_2E
      run_pdf "can/1e" STATUS_CAN_1E
      run_pdf "can/6e" STATUS_CAN_6E
      run_pdf "can/5e" STATUS_CAN_5E
      run_pdf "can/4e" STATUS_CAN_4E
      run_pdf "can/3e" STATUS_CAN_3E
      run_pdf "6e" STATUS_6E
      run_pdf "5e" STATUS_5E
      run_pdf "4e/4A^4e/4F^4e/4I^4e/4P^4e/4S" STATUS_4E_A_F_I_P_S
      run_pdf "4e/4C" STATUS_4E_C
      run_pdf "4e/4G^4e/4L" STATUS_4E_G_L
      run_pdf "3e" STATUS_3E

      echo ""
      echo "═══════════════════════════════════════════"
      echo "📊 Résumé pdf consolidated"
      echo "═══════════════════════════════════════════"
      [ "$STATUS_CAN_2E" = "ok" ] && echo "✅ can/2e" || echo "❌ can/2e"
      [ "$STATUS_CAN_1E" = "ok" ] && echo "✅ can/1e" || echo "❌ can/1e"
      [ "$STATUS_CAN_6E" = "ok" ] && echo "✅ can/6e" || echo "❌ can/6e"
      [ "$STATUS_CAN_5E" = "ok" ] && echo "✅ can/5e" || echo "❌ can/5e"
      [ "$STATUS_CAN_4E" = "ok" ] && echo "✅ can/4e" || echo "❌ can/4e"
      [ "$STATUS_CAN_3E" = "ok" ] && echo "✅ can/3e" || echo "❌ can/3e"
      [ "$STATUS_6E" = "ok" ] && echo "✅ 6e" || echo "❌ 6e"
      [ "$STATUS_5E" = "ok" ] && echo "✅ 5e" || echo "❌ 5e"
      [ "$STATUS_4E_A_F_I_P_S" = "ok" ] && echo "✅ 4e/4A^4e/4F^4e/4I^4e/4P^4e/4S" || echo "❌ 4e/4A^4e/4F^4e/4I^4e/4P^4e/4S"
      [ "$STATUS_4E_C" = "ok" ] && echo "✅ 4e/4C" || echo "❌ 4e/4C"
      [ "$STATUS_4E_G_L" = "ok" ] && echo "✅ 4e/4G^4e/4L" || echo "❌ 4e/4G^4e/4L"
      [ "$STATUS_3E" = "ok" ] && echo "✅ 3e" || echo "❌ 3e"
      exit $FAIL
  artifacts:
    when: on_failure
    paths:
      - updatefile/output/can*
      - updatefile/output/6e*
      - updatefile/output/5e*
      - updatefile/output/4e*
      - updatefile/output/3e*

