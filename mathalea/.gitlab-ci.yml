    - NODE_OPTIONS=--max-old-space-size=4096
    - pnpm run makeJson >/dev/null
    - sleep 50
    - |
      FAIL=0
      run_all () {
        NIV_LABEL="$1"
        STATUS_VAR="$2"
        echo "🧪 test all_exercises NIV=$NIV_LABEL"
        if NIV="$NIV_LABEL" NB_EXOS_PAR_LOT=1000 pnpm test:e2e:all_exercises; then
          eval "$STATUS_VAR=ok"
        else
          eval "$STATUS_VAR=ko"
