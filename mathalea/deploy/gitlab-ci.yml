# Hébergement Scaleway : ce fichier est inclus par le .gitlab-ci.yml de la
# racine, qui déclare aussi ses stages, ceux de la boucle DevSecOps : build
# (site et image), release (l'image recopiée sur le registry Scaleway), deploy
# (bascule du conteneur) et monitor (le site vérifié de l'extérieur).
# Le staging se met à jour quand un pipeline sur main porte la variable
# DEPLOY_STAGING=true : le scheduled pipeline "Déploiement staging" l'a (une
# fois par nuit, pas à chaque merge, main en reçoit plus de 25 par jour), et on
# la donne à la main dans "Run pipeline" pour l'avoir tout de suite. Avec cette
# variable, seuls les jobs de ce fichier tournent : les jobs de test de la
# racine s'effacent (.hors_deploiement dans le .gitlab-ci.yml de la racine).
# La production se déploie en posant le tag protégé "production" sur le commit
# voulu (deploy/promote.sh). Mode d'emploi : deploy/README.md

# Le site et son image sont construits par docker (docker-in-docker, comme la
# toolbox sur ces runners) avec le Dockerfile multi-stage de deploy/ (node
# construit, nginx sert), et poussés sur le registry de la forge. Le cache de
# couches, gardé dans le registry, évite de réinstaller les dépendances tant
# que le lockfile ne change pas.
build:site:
  stage: build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: '1'
    DOCKER_CERT_PATH: /certs/client
  cache: []
  # Une fois ce job parti, le pipeline n'est plus annulé par le pipeline suivant
  # sur main : le staging de la nuit arrive au bout.
  interruptible: false
  # Si le runner lâche en cours de route, nouvel essai.
  retry:
    max: 2
    when:
      - runner_system_failure
  needs: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Le constructeur par défaut ne sait pas exporter son cache vers un registry,
    # et buildx refuse de créer un constructeur depuis les variables TLS : on lui
    # donne un contexte Docker explicite.
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --driver docker-container dind
    - >-
      docker buildx build
      --file deploy/Dockerfile
      --tag "$CI_REGISTRY_IMAGE/site:$CI_COMMIT_SHORT_SHA"
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/cache/site"
      --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE/cache/site,mode=max"
      --push
      .
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_STAGING == "true"
    # Sur une MR, seulement si le déploiement lui-même change.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deploy/**/*
    - when: never

# Recopie de l'image vers le registry Scaleway : c'est la version livrée, celle
# construite sur main, identifiée par le SHA court du commit.
release:site:
  stage: release
  image:
    name: quay.io/skopeo/stable:v1.22.3
    entrypoint: ['']
  cache: []
  interruptible: false
  needs:
    # Absent du pipeline du tag production : l'image a été construite sur main.
    - job: build:site
      optional: true
  script:
    - sh deploy/copie-image.sh "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_STAGING == "true"
    - if: $CI_COMMIT_TAG == "production"
    - when: never

.deploy_scaleway:
  stage: deploy
  image:
    name: scaleway/cli:v2.61.0
    entrypoint: ['']
  cache: []
  interruptible: false
  variables:
    SCW_DEFAULT_REGION: fr-par
  needs:
    - release:site

deploy:staging:
  extends: .deploy_scaleway
  environment:
    name: staging
    # Le nom coopmaths : la vitrine à la racine. Le même conteneur répond aussi
    # sur staging.mathalea.fr, qui sert l'application à la racine.
    url: https://staging.coopmaths.fr
  script:
    - sh deploy/deploy.sh "$CI_COMMIT_SHORT_SHA" "$SCW_STAGING_CONTAINER_ID"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_STAGING == "true"
    - when: never

deploy:production:
  extends: .deploy_scaleway
  environment:
    name: production
    # Adresse du conteneur de production tant que coopmaths.fr n'a pas basculé.
    url: $PRODUCTION_URL
  script:
    - sh deploy/deploy.sh "$CI_COMMIT_SHORT_SHA" "$SCW_PRODUCTION_CONTAINER_ID"
  rules:
    - if: $CI_COMMIT_TAG == "production"
    - when: never

# Après chaque déploiement, le site est vérifié de l'extérieur avec la version
# attendue (deploy/smoke.sh) : /health, l'application, un scan, la vitrine.
.monitor:
  stage: monitor
  image:
    name: scaleway/cli:v2.61.0
    entrypoint: ['']
  cache: []
  interruptible: false

monitor:staging:
  extends: .monitor
  needs:
    - deploy:staging
  script:
    - sh deploy/smoke.sh https://staging.coopmaths.fr "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_STAGING == "true"
    - when: never

monitor:production:
  extends: .monitor
  needs:
    - deploy:production
  script:
    - sh deploy/smoke.sh "$PRODUCTION_URL" "$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_TAG == "production"
    - when: never
