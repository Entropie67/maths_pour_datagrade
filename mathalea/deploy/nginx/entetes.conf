# En-têtes communs à toutes les réponses. Mêmes en-têtes que l'hébergement
# actuel, pas d'en-tête anti-iframe : MathALÉA s'affiche dans Moodle et
# Capytale. Le fichier est inclus dans le server et dans chaque location qui a
# son propre add_header (X-Cache des relais), parce qu'un add_header dans un
# location annule ceux du niveau au-dessus.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Vide, donc absent, sur les noms de production ; noindex sur les adresses de
# test (map $robots dans default.conf.template).
add_header X-Robots-Tag $robots always;
